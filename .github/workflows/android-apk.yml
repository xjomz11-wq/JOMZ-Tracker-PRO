name: Build JOMZ Tracker PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libsqlite3-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Build debug APK
        working-directory: android_app
        shell: bash
        run: |
          set +e
          yes | buildozer android debug 2>&1 | tee build.log
          build_status=${PIPESTATUS[1]}
          if [ "$build_status" -ne 0 ]; then
            echo "===== LAST 120 BUILD LOG LINES ====="
            tail -n 120 build.log
          fi
          exit "$build_status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JOMZ-Tracker-PRO-build-log
          path: android_app/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOMZ-Tracker-PRO-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
